<header class="topbar">
  <a class="brand" routerLink="/scales" aria-label="Fretwise home" (click)="closeMenu()">
    <span class="brand-icon">
      f
      <span>↗</span>
    </span>
    fretwise
    <span class="brand-dot">.</span>
  </a>
  <span class="header-divider"></span>
  <span class="tagline">A little practice. A lot of possibility.</span>
  <span class="header-end">
    <span class="status-dot"></span>
    YOUR GUITAR JOURNEY STARTS HERE
  </span>
  <a
    class="github-link"
    href="https://github.com/taitran91095/fretwise"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View Fretwise on GitHub (opens in a new tab)"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path
        d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.64 1.22 3.28.93.1-.73.4-1.22.72-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.09 1.15a10.77 10.77 0 0 1 5.62 0c2.14-1.45 3.08-1.15 3.08-1.15.62 1.55.23 2.69.12 2.98.72.79 1.15 1.79 1.15 3.02 0 4.32-2.63 5.28-5.14 5.56.4.35.76 1.03.76 2.09v3.1c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"
      />
    </svg>
    <span>GitHub</span>
  </a>
  <button
    class="menu-toggle"
    type="button"
    aria-controls="practice-navigation"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="menuOpen.set(!menuOpen())"
  >
    <svg
      viewBox="0 0 24 24"
      width="22"
      height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      aria-hidden="true"
    >
      @if (menuOpen()) {
        <path d="m6 6 12 12M6 18 18 6" />
      } @else {
        <path d="M4 6h16M4 12h16M4 18h16" />
      }
    </svg>
  </button>
</header>
<app-pwa-status />
<main>
  <nav
    id="practice-navigation"
    class="page-nav"
    [class.is-open]="menuOpen()"
    aria-label="Practice pages"
  >
    <a
      routerLink="/scales"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      Scales
    </a>
    <a
      routerLink="/chords"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      Chords
    </a>
    <a
      routerLink="/strumming"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      Strumming
    </a>
    <a
      routerLink="/fingerpicking"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      Fingerpicking
    </a>
  </nav>
  <div id="page-content" tabindex="-1"><router-outlet (activate)="focusPage()" /></div>
  <footer>
    <span class="footer-brand">fretwise.</span>
    <span>Made for the joy of figuring it out.</span>
    <span>
      Keep exploring. Keep playing.
      <span class="footer-star">✧</span>
    </span>
  </footer>
</main>

<app-practice-tools />
